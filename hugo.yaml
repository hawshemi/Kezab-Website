baseURL: https://kezab.ir/
title: روستای کذاب

module:
  imports:
    - path: github.com/imfing/hextra
    
markup:
  goldmark:
    renderer:
      unsafe: true

  highlight:
    noClasses: false

enableInlineShortcodes: true

defaultContentLanguage: fa
defaultContentLanguageInSubdir: false

languages:
  en:
    label: English
    direction: ltr
    locale: en-US
    title: Kezab Village
    weight: 2
  fa:
    label: فارسی
    direction: rtl
    locale: fa-IR
    title: روستای کذاب
    weight: 1

menu:
  main:
    - identifier: home
      name: Home
      pageRef: /
      weight: 1
    - identifier: about
      name: About
      pageRef: /about
      weight: 2
    - identifier: gallery
      name: Gallery
      pageRef: /gallery
      weight: 3
    - identifier: contact
      name: Contact
      pageRef: /contact
      weight: 4
    - name: Search
      identifier: search
      weight: 5
      params:
        type: search
        icon: search
    - name: Language
      weight: 6
      params:
        type: language-switch
        label: true

params:
  theme:
    default: system
    displayToggle: true

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      js: vendor/flexsearch-0.8.143.min.js

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayTitle: true
    displayCopyright: true
    displayPoweredBy: false
