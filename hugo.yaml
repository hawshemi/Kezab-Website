baseURL: https://kezab.ir/
title: روستای کذاب

markup:
  goldmark:
    renderer:
      unsafe: true

defaultContentLanguage: fa
defaultContentLanguageInSubdir: false

languages:
  en:
    label: English
    direction: ltr
    locale: en-US
    title: Kezab Village
    weight: 2
  fa:
    label: فارسی
    direction: rtl
    locale: fa-IR
    title: روستای کذاب
    weight: 1

menu:
  main:
    - identifier: home
      name: Home
      pageRef: /
      weight: 1
    - identifier: about
      name: About
      pageRef: /about
      weight: 2
    - identifier: gallery
      name: Gallery
      pageRef: /gallery
      weight: 3
    - identifier: contact
      name: Contact
      pageRef: /contact
      weight: 4

disableKinds: [taxonomy, term]

outputFormats:
  Search:
    mediaType: application/json
    baseName: search
    isPlainText: true

outputs:
  home: [HTML, RSS, Search]
